    ${admin ? `<div class="grid3">
      <select id="r-account">${unassigned.map((a) => opt(ui, "r-account", a.address, `${a.label} \u2014 ${describeAccount(ui, a.address)}`, unassigned[0]?.address)).join("")}</select>
      <select id="r-org">${s.orgs.map((o) => opt(ui, "r-org", o.id, o.name, s.orgs[0]?.id)).join("")}</select>
      <select id="r-role">${opt(ui, "r-role", 1, "Submitter", 1)}${opt(ui, "r-role", 2, "Reviewer", 1)}</select>
      <button class="primary" data-act="assign">Assign role</button>
      <button data-act="revoke">Revoke role</button>
    </div>` : `<p class="muted">Switch to an admin key to change roles.</p>`}
  </div>`;
  }
  function proposalText(ui, p) {
    const t = ACTION[p.action];
    if (p.action === 0) return `${t}: \u201C${p.name}\u201D`;
    if (p.action === 1 || p.action === 2) return `${t}: ${orgName(ui, p.orgId)}`;
    if (p.action === 3 || p.action === 4) return `${t}: ${acct(ui, p.target)?.label ?? p.target}`;
    return `${t} to ${p.value}`;
  }
  function eventText(ui, e) {
    const a = e.args;
    switch (e.name) {
      case "PackageSubmitted":
        return `Submitted ${a.packageId} v${a.version} by ${who(ui, a.submittedBy)} \u2192 ${orgName(ui, a.recipientOrg)} (hash ${short(a.evidenceHash)})`;
      case "ReceiptAcknowledged":
        return `Receipt acknowledged (record #${a.recordId}) by ${who(ui, a.by)} \u2014 hash matched`;
      case "ReviewCompleted":
        return `Review completed (record #${a.recordId}) by ${who(ui, a.by)}`;
      case "CorrectionRequested":
        return `Correction requested (record #${a.recordId}) by ${who(ui, a.by)}`;
      case "PackageSuperseded":
        return `Record #${a.recordId} superseded by #${a.newRecordId}`;
      case "ProposalCreated":
        return `Proposal #${a.proposalId} (${ACTION[a.action]}) by ${who(ui, a.proposer)}`;
      case "ProposalApproved":
        return `Proposal #${a.proposalId} approved by ${who(ui, a.admin)} (${a.approvals})`;
      case "ProposalExecuted":
        return `Proposal #${a.proposalId} executed`;
      case "OrganisationAdmitted":
        return `Organisation admitted: ${a.name} (#${a.orgId})`;
      case "OrganisationStatusChanged":
        return `${orgName(ui, a.orgId)} ${a.active ? "reinstated" : "suspended"}`;
      case "RoleAssigned":
        return `${acct(ui, a.account)?.label ?? short(a.account)} \u2192 ${ROLE[a.role]} at ${orgName(ui, a.orgId)}`;
      case "RoleRevoked":
        return `Role revoked: ${acct(ui, a.account)?.label ?? short(a.account)}`;
      case "AdminChanged":
        return `Admin ${a.added ? "added" : "removed"}: ${acct(ui, a.account)?.label ?? short(a.account)}`;
      case "ThresholdChanged":
        return `Approval threshold set to ${a.threshold}`;
      default:
        return e.name;
    }
  }
  function renderLedger(ui) {
    const evs = ui.events.slice().reverse();
    const lite = ui.info.mode === "lite";
    return `
  ${lite ? `<div class="card"><h2>Blocks</h2>
    <p class="hint">Each block stores the hash of the previous block. Editing any sealed block breaks the chain of hashes \u2014 try it.</p>
    <div class="row"><button data-act="checkchain">Verify chain integrity</button><button data-act="tamperblock" class="danger">Tamper with a sealed block</button>
      ${ui.chainCheck ? `<span class="${ui.chainCheck.ok ? "okline" : "errline"}">${ui.chainCheck.ok ? `\u2714 ${ui.chainCheck.blocks} blocks, all links valid` : `\u2718 Block #${ui.chainCheck.block}: ${ui.chainCheck.problem}`}</span>` : ""}</div>
    <div class="blocks">${ui.backend.blocks.slice(-8).reverse().map((b) => `<div class="blk"><b>#${b.number}</b> <code>${short(b.hash, 12)}</code><br><span class="muted">prev <code>${short(b.parentHash, 12)}</code></span><br>${esc(b.txs[0]?.method ?? "genesis")}</div>`).join("")}</div>
  </div>` : ""}
  <div class="card"><h2>Events on the ledger</h2>
    <p class="hint">Everything CorpVerify knows. No documents, no personal data \u2014 hashes, organisations, accounts, statuses, times.</p>
    <table><tr><th>Block</th><th>Event</th><th>Tx</th><th>Time</th></tr>
    ${evs.map((e) => `<tr><td>#${e.block}</td><td><b>${e.name}</b><br>${esc(eventText(ui, e))}</td><td><code>${short(e.tx, 8)}</code></td><td class="muted">${fmtTime(e.time)}</td></tr>`).join("")}
    </table>
  </div>`;
  }
  function renderAbout(ui) {
    return `<div class="card prose">
    <h2>How this proof of concept works</h2>
    <p><b>Mode:</b> ${ui.info.mode === "chain" ? `the CorpVerify smart contract (Solidity) is deployed at <code>${ui.info.contractAddress}</code> on a local Hardhat Ethereum network. Every action is a signed transaction from the selected account.` : "this page simulates the CorpVerify smart contract and a hash-linked ledger in JavaScript. It enforces the same rules and error codes as the Solidity contract (checked by an automated parity test). Nothing leaves your browser; reloading resets the demo."}</p>
    <h3>Try the full story</h3>
    <ol>
      <li><b>Alice</b> (Atlas, submitter): <i>Use sample documents</i> \u2192 <i>Submit to CorpVerify</i>.</li>
      <li><b>Bob</b> (Northbridge, reviewer): tick <i>simulate a document altered in transit</i> \u2192 <i>Load files shared off-chain</i> \u2192 <i>Acknowledge receipt</i>. The contract rejects it: hashes differ.</li>
      <li>Untick, load again, acknowledge \u2192 <i>Request correction</i>.</li>
      <li><b>Alice</b>: <i>Prepare corrected version</i>, edit a document \u2192 <i>Submit v2</i>. v1 becomes Superseded.</li>
      <li><b>Bob</b>: load, acknowledge, <i>Record review completed</i>.</li>
      <li><b>Verify a package</b>: load v1 or v2 and look it up \u2014 both are on record, with full history.</li>
      <li><b>Admin \u2014 Atlas</b>: propose <i>Admit organisation</i>; switch to <b>Admin \u2014 Northbridge</b> and approve. Then assign <b>Erin</b> a role in the new organisation.</li>
    </ol>
    <h3>What is on-chain</h3>
    <p>Package ID, version, package hash, submitting and receiving organisation, signing account, time, workflow status and version links. Original documents never go on the ledger.</p>
    <h3>Package hash</h3>
    <p>SHA-256 of each file; the file names and file hashes are sorted into a manifest; the package hash is the SHA-256 of that manifest. Changing a byte, renaming, adding or removing a file changes it.</p>
    <h3>Limits of the PoC</h3>
    <p>Single local node instead of a multi-validator permissioned network; test accounts instead of organisation identity and wallets; all participants can read all records; the off-chain share is simulated in the browser.</p>
  </div>`;
  }
  function scopeTarget(ui, scope) {
    if (scope === "draft") return ui.draft;
    if (scope === "verify") return ui.verify;
    if (scope.startsWith("recv-")) {
      const id = Number(scope.slice(5));
      if (!ui.receive.has(id)) ui.receive.set(id, { files: [], hash: null, manifest: [], tamper: false });
      return ui.receive.get(id);
    }
  }
  async function onClick(ui, e) {
    const el = e.target.closest("[data-act]");
    if (!el || el.tagName === "SELECT" || el.tagName === "INPUT" || el.tagName === "TEXTAREA") return;
    const act = el.dataset.act;
    const id = Number(el.dataset.id);
    const b = ui.backend;
    if (act === "tab") {
      e.preventDefault();
      ui.tab = el.dataset.tab;
      return render(ui);
    }
    if (act === "samples") {
      ui.draft.files = SAMPLES.map((s) => textEntry(s.name, s.text));
      await rehash(ui.draft);
      return render(ui);
    }
    if (act === "addtext") {
      const t = scopeTarget(ui, el.dataset.scope);
      t.files.push(textEntry(`document_${t.files.length + 1}.txt`, ""));
      await rehash(t);
      return render(ui);
    }
    if (act === "rmfile") {
      const t = scopeTarget(ui, el.dataset.scope);
      t.files.splice(Number(el.dataset.i), 1);
      await rehash(t);
      return render(ui);
    }
    if (act === "submit") {
      const d = ui.draft;
      const files = d.files.map((f) => ({ ...f, bytes: f.bytes.slice() }));
      const hash = d.hash, packageId = d.packageId.trim();
      return run(ui, `Submit ${packageId}`, async () => {
        const r = await b.submit(ui.actor, packageId, hash, d.recipient);
        ui.offchain.set(hash, { packageId, files });
        d.files = [];
        d.hash = null;
        d.manifest = [];
        return r;
      });
    }
    if (act === "newversion") {
      const r = ui.state.records.find((x) => x.id === id);
      const prev = ui.offchain.get(r.evidenceHash);
      ui.draft.packageId = r.packageId;
      ui.draft.recipient = r.recipientOrg;
      ui.draft.files = prev ? prev.files.map((f) => f.editable ? textEntry(f.name, f.text) : { ...f }) : [];
      await rehash(ui.draft);
      note(ui, "info", `Draft loaded from v${r.version}. Change the documents so the new version gets a new hash, then submit.`);
      window.scrollTo?.(0, 0);
      return render(ui);
    }
    if (act === "fetch") {
      const r = ui.state.records.find((x) => x.id === id);
      const t = scopeTarget(ui, `recv-${id}`);
      const shared = ui.offchain.get(r.evidenceHash);
      t.files = shared.files.map((f) => ({ ...f, bytes: f.bytes.slice() }));
      if (t.tamper && t.files.length) {
        const i = Math.max(0, t.files.findIndex((f2) => /60%/.test(f2.text ?? "")));
        const f = t.files[i];
        let bytes;
        if (f.text && /60%/.test(f.text)) bytes = enc3.encode(f.text.replace("60%", "\xA7").replace("40%", "60%").replace("\xA7", "40%"));
        else {
          bytes = f.bytes.slice();
          if (bytes.length) bytes[bytes.length - 1] ^= 1;
          else bytes = enc3.encode(" ");
        }
        t.files[i] = { name: f.name, bytes, editable: false };
      }
      await rehash(t);
      return render(ui);
    }
    if (act === "ack") {
      const t = ui.receive.get(id);
      return run(ui, `Acknowledge receipt of record #${id}`, () => b.acknowledgeReceipt(ui.actor, id, t.hash));
    }
    if (act === "complete") return run(ui, `Record review completed for #${id}`, () => b.completeReview(ui.actor, id));
    if (act === "correction") return run(ui, `Request correction for #${id}`, () => b.requestCorrection(ui.actor, id));
    if (act === "verify") {
      const rid = await b.recordByHash(ui.verify.hash);
      ui.verify.result = { id: rid, history: rid ? await b.getHistory(rid) : [] };
      return render(ui);
    }
    if (act === "approve") return run(ui, `Approve proposal #${id}`, () => b.approve(ui.actor, id));
    if (act === "propose") {
      const action = Number($("#p-action", ui.root).value);
      const name = $("#p-name", ui.root).value.trim();
      const orgId = Number($("#p-org", ui.root).value);
      const target = $("#p-target", ui.root).value;
      const value = Number($("#p-value", ui.root).value);
      return run(ui, `Propose: ${ACTION[action]}`, () => b.propose(ui.actor, action, target, orgId, value, name));
    }
    if (act === "assign") {
      const account = $("#r-account", ui.root).value;
      return run(ui, `Assign role to ${acct(ui, account)?.label}`, () => b.assignRole(ui.actor, account, Number($("#r-org", ui.root).value), Number($("#r-role", ui.root).value)));
    }
    if (act === "revoke") {
      const account = $("#r-account", ui.root).value;
      return run(ui, `Revoke role of ${acct(ui, account)?.label}`, () => b.revokeRole(ui.actor, account));
    }
    if (act === "checkchain") {
      ui.chainCheck = await b.verifyChain();
      return render(ui);
    }
    if (act === "tamperblock") {
      const n = b.blocks.findIndex((x) => x.txs[0]?.method === "submit");
      b.tamperWithBlock(n > 0 ? n : 1);
      note(ui, "info", `Block #${n > 0 ? n : 1} was edited directly (as an insider with database access might). Now verify the chain.`);
      ui.chainCheck = null;
      return render(ui);
    }
  }
  async function onChange(ui, e) {
    const el = e.target;
    if (/^[pr]-/.test(el.id)) {
      ui.forms[el.id] = el.value;
      return;
    }
    const act = el.dataset.act;
    if (act === "actor") {
      ui.actor = el.value;
      return render(ui);
    }
    if (act === "recipient") {
      ui.draft.recipient = Number(el.value);
      return render(ui);
    }
    if (act === "upload") {
      const t = scopeTarget(ui, el.dataset.scope);
      t.files.push(...await readFiles(el.files));
      await rehash(t);
      return render(ui);
    }
    if (act === "tamper") {
      const t = scopeTarget(ui, `recv-${el.dataset.id}`);
      t.tamper = el.checked;
      t.files = [];
      t.hash = null;
      return render(ui);
    }
    if (act === "verifypick") {
      const p = ui.offchain.get(el.value);
      if (!p) return;
      ui.verify.files = p.files.map((f) => ({ ...f, bytes: f.bytes.slice() }));
      ui.verify.result = null;
      await rehash(ui.verify);
      return render(ui);
    }
  }
  async function onInput(ui, e) {
    const el = e.target;
    if (/^[pr]-/.test(el.id)) {
      ui.forms[el.id] = el.value;
      return;
    }
    const act = el.dataset.act;
    if (act === "pkgid") {
      ui.draft.packageId = el.value;
      return render(ui);
    }
    if (act === "ftext" || act === "fname") {
      const t = scopeTarget(ui, el.dataset.scope);
      const f = t.files[Number(el.dataset.i)];
      if (act === "ftext") {
        f.text = el.value;
        f.bytes = enc3.encode(el.value);
      } else f.name = el.value;
      if (t === ui.verify) t.result = null;
      await rehash(t);
      return render(ui);
    }
  }

  // ui/main-lite.js
  start(new SimBackend(), document.getElementById("app")).then((ui) => {
    window.corpverify = ui;
  });
})();

</script>
</body>
